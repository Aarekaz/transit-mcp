name = "metro-mcp"
main = "src/index.ts"
compatibility_date = "2025-12-25"
workers_dev = true

# Preserve environment variables set in dashboard on deploy
keep_vars = true

# Minify JavaScript for better performance
minify = true

# Upload source maps for better error debugging
upload_source_maps = true

# KV Namespaces for OAuth client registration
[[kv_namespaces]]
binding = "OAUTH_CLIENTS"
id = "44f6224b68354c24bf071e2b53b13dbb"
preview_id = "7d10b069531a459cb56ed59220ede55b"

# KV Namespace for rate limiting
# WHY SEPARATE KV:
# - High write volume (every request)
# - Automatic expiration via TTL
# - Different access patterns than OAuth data
# - Better performance and cost optimization
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "93885a8c949b4298a7d866e2cef408b3"
preview_id = "7cbeddccb3a94346b4452f40bc692b39"

# KV Namespace for MCP session management
# WHY MCP SESSIONS:
# - Tracks active MCP connections with Mcp-Session-Id header
# - Stores session state for SSE event resumability
# - Enables event ID tracking and Last-Event-ID support
# - Automatic cleanup via TTL (24 hours)
[[kv_namespaces]]
binding = "MCP_SESSIONS"
id = "5d8c66d201ed4fa3ac00f7acdb930632"
preview_id = "da9efc735f9a49f7ba1827ebf5d33d29"

# Non-secret environment variables
[vars]
GITHUB_CLIENT_ID = "Ov23liGFwmOZeECJ6yeN"  # OAuth client ID (public)
OAUTH_REDIRECT_URI = "https://metro-mcp.anuragd.me/callback"

# Static assets (landing page)
[assets]
directory = "./public"

# Observability and logging configuration
[observability]
enabled = true  # Enable for production monitoring

[observability.logs]
enabled = true  # Enable logging
head_sampling_rate = 0.25  # Sample 25% of requests 
invocation_logs = true

[[routes]]
pattern = "metro-mcp.anuragd.me"
custom_domain = true