name: type-check

# Full `tsc --noEmit` currently OOMs on GitHub-hosted runners while resolving
# the MCP SDK/Zod tool-definition generics. Keep CI useful by running the unit
# suite plus a Wrangler dry-run bundle, which validates the Worker entrypoint,
# bindings, static assets, and esbuild compilation without deploying.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun run test

      - name: Worker bundle dry-run
        run: bunx wrangler deploy --dry-run --outdir /tmp/metro-mcp-dry-run
