name: type-check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run type-check

      - name: Unit and Workerd tests
        run: bun run test

      - name: Worker bundle dry-run
        run: bunx wrangler deploy --dry-run --outdir /tmp/metro-mcp-dry-run
